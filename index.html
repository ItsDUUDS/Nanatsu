<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/reset.css">
    
    <title>Projeto Nanatsu no Taizai</title>
</head>
<body>
    <header class="cabecalho">
        <img class="logo" src="./src/Images/Logo Nanatsu.png" alt="Logo Nanatsu no Taizai">
    </header>

    <main class="selecao-personagens"> 
        <section class="personagens">
            <h1 class="titulo">Selecione um Personagem</h1>
            <ul class="lista-personagens">
                <li class="personagem selecionado" id="meliodas" data-name="Meliodas">
                    <img src="./src/Nanatsu icons/Meliodas icon.jpg" alt="Personagem Meliodas">
                </li>
                
                <li class="personagem" id="ban" data-name="Ban"> <img src="./src/Nanatsu icons/Ban icon.jpg" alt="Personagem Ban"></li>
                
                <li class="personagem" id="diane" data-name="Diane"><img src="./src/Nanatsu icons/Diane icon.jpg" alt="Personagem Diane"></li>
                
                <li class="personagem" id="king" data-name="King"><img src="./src/Nanatsu icons/King icon.jpg" alt="Personagem King"></li>
               
                <li class="personagem" id="gowther" data-name="Gowther"><img src="./src/Nanatsu icons/Gowther icon.jpg" alt="Personagem Gowther"></li>
                
                <li class="personagem" id="merlin" data-name="Merlin"><img src="./src/Nanatsu icons/Merlin icon.jpg" alt="Personagem Merlin"></li>
                
                <li class="personagem" id="escanor" data-name="Escanor"><img src="./src/Nanatsu icons/Escanor icon.jpg" alt="Personagem Escanor"></li>
            </ul>
        </section>
        <section class="personagem-selecionado">
            <img class="personagem-grande" src="./src/Images/Meliodas.png" alt="Meliodas">

            <div class="informacoes-personagem">
                <h2 class="nome-personagem" id="nome-personagem">Meliodas</h2>
                <p class="descricao-personagem"> Capitão dos 7 Pecados Capitais e primogênito do Rei dos Demônios, Meliodas o Pecado da Ira do Dragão.</p>
            </div>
        </section>
    </main>
    <script src="./index.js"></script>
</body>
</html>
