<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/reset.css">
    
    <title>Projeto Nanatsu no Taizai</title>
</head>
<body>
    <header class="cabecalho">
        <img class="logo" src="./src/Images/Logo Nanatsu.png" alt="Logo Nanatsu no Taizai">
    </header>

    <main class="selecao-personagens"> 
        <section class="personagens">
            <h1 class="titulo">Selecione um Personagem</h1>
            <ul class="lista-personagens">
                <li class="personagem selecionado" id="Meliodas" data-name="Meliodas" data-description="Meliodas, é o líder dos Sete Pecados Capitais e atual Rei de Liones,, carregando o título de Pecado da Ira do Dragão.">
                    <img src="./src/Nanatsu icons/Meliodas icon.jpg" alt="Personagem Meliodas">
                </li>
                
                <li class="personagem" id="Ban" data-name="Ban" 
                data-description="Ban é um membro dos Sete Pecados Capitais, conhecido como o Pecado da Ganância da Raposa,"> 
                <img src="./src/Nanatsu icons/Ban icon.jpg" alt="Personagem Ban"></li>
                
                <li class="personagem" id="Diane" data-name="Diane" data-description="Diane é um membro dos Sete Pecados Capitais e é conhecida como o Pecado da Inveja da Serpente, além de ser a Rainha das Fadas."><img src="./src/Nanatsu icons/Diane icon.jpg" alt="Personagem Diane"></li>
                
                <li class="personagem" id="King" data-name="King" data-description="King é um membro dos Sete Pecados Capitais e é conhecido como o Pecado da Preguiça do Urso. Seu nome verdadeiro é Rei das Fadas Harlequin,"><img src="./src/Nanatsu icons/King icon.jpg" alt="Personagem King"></li>

                <li class="personagem" id="Gowther" data-name="Gowther" data-description="Gowther é um membro dos Sete Pecados Capitais e é conhecido como o Pecado da Cabra da Luxúria."><img src="./src/Nanatsu icons/Gowther icon.jpg" alt="Personagem Gowther"></li>
                
                <li class="personagem" id="Merlin" data-name="Merlin" data-description="Merlin é um membro dos Sete Pecados Capitais e é conhecida como o Pecado da Gula do Javali. Ela é considerada a maior maga de Britânia"><img src="./src/Nanatsu icons/Merlin icon.jpg" alt="Personagem Merlin"></li>
                
                <li class="personagem" id="Escanor" data-name="Escanor" data-description="Escanor era o Pecado do Leão do Orgulho dos Sete Pecados Capitais, e o homem conhecido em todo o Reino de Liones como O Cavaleiro Sagrado Mais Forte."> <img src="./src/Nanatsu icons/Escanor icon.jpg"alt="Personagem Escanor"></li>
            </ul>
        </section>
        <section class="personagem-selecionado">
            <img class="personagem-grande" src="./src/Images/Meliodas.jpg" alt="Personagem Selecionado">

            <div class="informacoes-personagem">
                <h2 class="nome-personagem" id="nome-personagem">Meliodas</h2>
                <p class="descricao-personagem" id="descricao-personagem"> Meliodas, é o líder dos Sete Pecados Capitais e atual Rei de Liones,, carregando o título de Pecado da Ira do Dragão.</p>
            </div>
        </section>
    </main>
    <script src="./index.js"></script>
</body>
</html>
